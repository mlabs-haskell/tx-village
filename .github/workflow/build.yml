name: "Build all Nix derivations"
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: {{ '${{ matrix.os }}' }}

    steps:
    - uses: actions/checkout@v5
    - uses: cachix/install-nix-action@v31
    - uses: cachix/cachix-action@v16
      with:
        name: tx-village
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - run: nix-build
